steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/kade-frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_BASE_URL=$_NEXT_PUBLIC_API_BASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_USE_MOCK=$_NEXT_PUBLIC_USE_MOCK'
      - '--build-arg'
      - 'API_PROXY_TARGET=$_API_BASE_URL'
      - '--build-arg'
      - 'API_BASE_URL=$_API_BASE_URL'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kade-frontend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kade-frontend:latest'
      - '.'
    timeout: '1800s'

  # 2. Push the image to Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/kade-frontend:$BUILD_ID']
    timeout: '1800s'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/kade-frontend:latest']
    timeout: '1800s'

  # 3. Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'kade-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/kade-frontend:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--set-env-vars'
      - 'API_PROXY_TARGET=$_API_BASE_URL,API_BASE_URL=$_API_BASE_URL'
    timeout: '1200s'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '100'

substitutions:
  _REGION: 'asia-south1'
  _API_BASE_URL: 'http://8.234.94.139:8000/api'
  _NEXT_PUBLIC_API_BASE_URL: '/api'
  _NEXT_PUBLIC_USE_MOCK: 'false'

images:
  - 'gcr.io/$PROJECT_ID/kade-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/kade-frontend:latest'

timeout: '1800s'
